[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs", "php82Extensions.gd", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl"]

[phases.build]
cmds = [
    "export COMPOSER_ALLOW_SUPERUSER=1",
    "composer install --no-dev --optimize-autoloader",
    "npm install && npm run build"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"