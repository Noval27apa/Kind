[phases.setup]
nixPkgs = ["php82", "composer"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --ignore-platform-reqs --no-interaction --no-scripts"
]

[phases.build]
cmds = []

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"